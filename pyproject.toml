[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokensaver"
version = "0.1.0"
description = "Token optimization toolkit for AI projects — CLI + library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "tiktoken>=0.7",
    "markdownify>=0.12",
    "beautifulsoup4>=4.12",
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
llmlingua = [
    "llmlingua>=0.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
tokensaver = "tokensaver.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["tokensaver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
